[project]
name = "ruc-sunat"
version = "1.0.0"
description = "Sistema de consulta del padrón reducido de contribuyentes SUNAT"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.104",
    "uvicorn>=0.24",
    "slowapi>=0.1.10",
    "cachetools>=5.3",
    "jinja2>=3.1",
    "python-multipart>=0.0.6",
    "pydantic-settings>=2.12",
    "python-dotenv>=1.0",
    "requests>=2.32",
]

[project.scripts]
ruc-api = "apps.api.main:main"
ruc-updater = "apps.updater.main:main"

[tool.setuptools.packages.find]
include = ["packages*", "apps*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
